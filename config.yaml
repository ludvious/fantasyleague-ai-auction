# Config simulation

simulation:
  num_buyers: 4
  budget_iniziale: 500
  rosa_size: 25
  seed: 42

llm:
  provider: ""  # Options: anthropic, openai, ollama, custom
  model: ""
  max_tokens: 300
  temperature: 0.6
  timeout: 15
  retry_attempts: 3
  retry_delay: 5  # secondi

buyers:
  - id: "buyer_1"
    name: "Squadra Alfa"
    personality: ""
  
  - id: "buyer_2"
    name: "Squadra Beta"
    personality: ""
  
  - id: "buyer_3"
    name: "Squadra Gamma"
    personality: ""
  
  - id: "buyer_4"
    name: "Squadra Delta"
    personality: ""

paths:
  database: "data/...xlsx"
  checkpoints: "data/checkpoints"
  output: "data/results"
  logs: "logs"
  strategies: "configs/strategies"

auction:
  max_tie_breaker_rounds: 1
  bid_collection_timeout: 20  # secondi per buyer
  checkpoint_interval: 10  # salva ogni N transazioni

logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan> - <level>{message}</level>"
  rotation: "10 MB"
  retention: "1 week"